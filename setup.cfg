[metadata]
name = surfaces
version = 2.0.0a1
description = Tools for on-surface chemistry, developed at the nanotech@surfaces laboratory, Empa.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-surfaces
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 3 - Alpha
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
project_urls =
    Logo = https://raw.githubusercontent.com/nanotech-empa/aiidalab-empa-surfaces/master/miscellaneous/logos/empa.png
    Documentation = https://github.com/nanotech-empa/aiidalab-empa-surfaces/#readme
    Bug Tracker = https://github.com/nanotech-empa/aiidalab-empa-surfaces/issues

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@45c4307a9db39ac5debc7a2b87f0ad869a425c17
    aiidalab-widgets-base[smiles] @ git+https://github.com/cpignedoli/aiidalab-widgets-base.git@eb3672a7471f658371a38927d1563d78203ac028
    aiidalab-widgets-empa>=0.2.2
    ase>=3.24
    cubehandler>=0.2.1
python_requires = >=3.9

[options.extras_require]
dev =
    bumpver==2022.1119
    mypy
    pre-commit~=4.3

[aiidalab]
title = Empa nanotech@surfaces Laboratory - On-Surface Chemistry

[flake8]
ignore =
    E501
    W503
    E203
per-file-ignores =
    surfaces_tools/widgets/lowdimfinder.py: C414, E266, N802, N806, N816, N818, TRY003, TRY200
    tests/*: U100, U101

[bumpver]
current_version = "v2.0.0a1"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}."
commit = True
tag = True
push = True

[bumpver:file_patterns]
setup.cfg =
    current_version = "{version}"
    version = {pep440_version}
