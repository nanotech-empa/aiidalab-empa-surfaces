[metadata]
name = surfaces
version = 1.1.0
description = Tools for on-surface chemistry, developed at the nanotech@surfaces laboratory, Empa.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-surfaces
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 5 - Production/Stable
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
project_urls =
    Logo = https://raw.githubusercontent.com/nanotech-empa/aiidalab-empa-surfaces/master/miscellaneous/logos/empa.png
    Documentation = https://github.com/nanotech-empa/aiidalab-empa-surfaces/#readme
    Bug Tracker = https://github.com/nanotech-empa/aiidalab-empa-surfaces/issues

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiidalab>=26.9.0
    cp2k-input-tools>=0.9.3
    aiida-pseudo~=1.11
    aiida-cp2k>=2.2.1,<3
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@5ab84bd6b2182afaa858a900a2b1a0ae1e409ec8
    aiidalab-widgets-base[smiles] @ git+https://github.com/cpignedoli/aiidalab-widgets-base.git@f2773b82017d503c40751f9c082f941eef83ee33
    aiidalab-widgets-empa @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8a85258bbb449ff99c1d0ee302fd4b6ae887c254
    ase>=3.24
    cubehandler @ git+https://github.com/nanotech-empa/cubehandler.git@718293e2451825c400ab08b376216024a7ed97b1
python_requires = >=3.12

[options.extras_require]
scf-preview =
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@5ab84bd6b2182afaa858a900a2b1a0ae1e409ec8
    cp2k-input-tools>=0.9.3
unfolding-preview =
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@5ab84bd6b2182afaa858a900a2b1a0ae1e409ec8
    cp2k-spm-tools @ git+https://github.com/nanotech-empa/cp2k-spm-tools.git@a0e486a12ad0102c6af5f9a9572c2449ec26e81e
dev =
    bumpver==2022.1119
    mypy
    pre-commit~=4.3
    pytest~=8.0

[aiidalab]
title = Empa nanotech@surfaces Laboratory - On-Surface Chemistry

[flake8]
ignore =
    E501
    W503
    E203
per-file-ignores =
    surfaces_tools/widgets/lowdimfinder.py: C414, E266, N802, N806, N816, N818, TRY003, TRY200
    tests/*: U100, U101

[bumpver]
current_version = "v1.1.0"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}."
commit = True
tag = True
push = True

[bumpver:file_patterns]
setup.cfg =
    current_version = "{version}"
    version = {pep440_version}
